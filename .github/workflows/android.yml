name: HARIS Android Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build HARIS Debug APK
        working-directory: src/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HARIS-debug-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
      - name: Build HARIS Release APK (unsigned)
        working-directory: src/android
        run: ./gradlew :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HARIS-release-apk
          path: src/android/app/build/outputs/apk/release/*.apk
